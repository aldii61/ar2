<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>

    <style>
      .title-overlay {
        position: absolute;
        top: 150px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        color: #ffffff;
        font-family: "Segoe UI", Roboto, sans-serif;
        font-size: 50px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-shadow:
          0 0 12px rgba(0, 217, 255, 0.8),
          0 0 24px rgba(0, 217, 255, 0.4);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }

      .title-overlay-2 {
        position: absolute;
        top: 220px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        color: #ffffff;
        font-family: "Segoe UI", Roboto, sans-serif;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
        text-shadow:
          0 0 12px rgba(0, 217, 255, 0.8),
          0 0 24px rgba(0, 217, 255, 0.4);
        pointer-events: none;
        user-select: none;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="title-overlay">Exploring The Cosmos</div>
    <div class="title-overlay-2">宇宙の探査</div>

    <a-scene physics="gravity: -5">
      <a-sky
        material="src:#bintang"
        animation="property:rotation; to:0 360 0;
        loop:true;
        easing:linear;
        dur:60000;"
      ></a-sky>

      <a-assets>
        <img id="rocket" src="../assets/image/rocket.png" alt="" />
        <img id="satelit" src="./satelit.png" alt="" />
        <img id="sun" src="./sun.jpg" alt="" />
        <img id="mercury" src="../assets/image/mercury.jpg" alt="" />
        <img id="venus" src="../assets/image/venus.jpg" alt="" />
        <img id="earth" src="./earth.jpg" alt="" />
        <img id="mars" src="../assets/image/mars.jpg" alt="" />
        <img id="jupiter" src="../assets/image/jupiter.jpg" alt="" />
        <img id="saturnus" src="../assets/image/saturn.jpg" alt="" />
        <img id="saturn_ring" src="../assets/image/saturn_ring.png" alt="" />
        <img id="uranus" src="../assets/image/uranus.jpg" alt="" />
        <img id="neptune" src="../assets/image/neptune.jpg" alt="" />
        <img id="bintang" src="../assets/image/bintang.jpg" alt="" />
        <img id="ccc" src="../assets/image/3.png" alt="" />
      </a-assets>

      <a-ring
        position="0 0 0"
        radius-inner="5"
        radius-outer="26"
        rotation="90 0 0"
        material="color: #00e5ff; opacity: 0.15; transparent: true; side: double; shader: flat"
      ></a-ring>

      <a-image
        src="#rocket"
        position="-25 8 28"
        width="1.5"
        height="2.5"
        radius="0.7"
        scale="1.3 1.5 1"
        animation="property:position; to:10 80 -30;
        loop:true;
        easing:linear;
        dur:15000;"
      ></a-image>

      <a-image
        src="#satelit"
        position="8 15.2 33"
        width="1.5"
        height="2.5"
        animation="property:rotation; to:0 360 0;
          loop:true;
          easing:linear;
          dur:18000;"
      ></a-image>

      <!--SUN-->
      <a-sphere
        position="0 0 0"
        radius="4"
        material="src:#sun"
        static-body
        id="ball"
        animation="property:rotation; to:0 360 0;
        loop:true;
        easing:linear;
        dur:8000;"
      ></a-sphere>

      <!--MERCURY-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="6"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #FFFFFF; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 5000"
        >
          <a-sphere
            position="6 0 0"
            radius="0.4"
            material="src: #mercury"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--VENUS-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="8"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #FFE600; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 8000"
        >
          <a-sphere
            position="8 0 0"
            radius="0.4"
            material="src: #venus"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--EARTH-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="10"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #00FFFF; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 10000"
        >
          <a-sphere
            position="10 0 0"
            radius="0.5"
            material="src: #earth"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--MARS-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="12"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #FF0055; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 12000"
        >
          <a-sphere
            position="12 0 0"
            radius="0.4"
            material="src: #mars"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--JUPITER-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="15"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #FF6600; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 18000"
        >
          <a-sphere
            position="15 0 0"
            radius="0.9"
            material="src: #jupiter"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--SATURN-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="18"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #39FF14; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 22000"
        >
          <!--saturn_ring-->
          <a-entity position="18 0.5 0">
            <a-sphere radius="0.8" material="src: #saturnus"></a-sphere>
            <a-ring
              radius-inner="1.0"
              radius-outer="1.8"
              rotation="75 0 0"
              material="src: #saturn_ring; transparent: true; side: double; shader: flat"
            ></a-ring>
          </a-entity>
        </a-entity>
      </a-entity>

      <!--URANUS-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="21"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #BF00FF; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 26000"
        >
          <a-sphere
            position="21 0 0"
            radius="0.7"
            material="src: #uranus"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!--NEPTUNE-->
      <a-entity position="0 0 0" rotation="0 0 0">
        <a-torus
          radius="24"
          radius-tubular="0.04"
          rotation="90 0 0"
          material="color: #FF00FF; opacity: 0.5; shader: flat"
        ></a-torus>
        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; easing: linear; dur: 30000"
        >
          <a-sphere
            position="24 0 0"
            radius="0.7"
            material="src: #neptune"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <a-camera position="0 12 41" rotation="-25 0 0"></a-camera>
    </a-scene>
  </body>
</html>
