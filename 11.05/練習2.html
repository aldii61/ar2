<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Magic Circle</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>
  </head>

  <body>
    <a-scene hands id="scene">
      <a-assets>
        <video
          id="video"
          src="player/sky.mp4"
          preload="auto"
          playsinline
          muted
        ></video>
      </a-assets>

      <!-- Video -->
      <a-video
        src="#video"
        opacity="0.8"
        width="3.2"
        height="1.8"
        rotation="-10 0 0"
        position="0 0.5 -2"
      ></a-video>

      <!-- Tombol Play -->
      <a-plane
        id="playButton"
        color="#a7a7fd"
        width="0.8"
        height="0.4"
        position="-0.5 -0.8 -2"
      >
        <a-text value="PLAY" align="center" color="#000" width="3"></a-text>
      </a-plane>

      <!-- Tombol Pause -->
      <a-plane
        id="pauseButton"
        color="#ffa5a5"
        width="0.8"
        height="0.4"
        position="0.5 -0.8 -2"
      >
        <a-text value="PAUSE" align="center" color="#000" width="3"></a-text>
      </a-plane>

      <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
      const scene = document.getElementById("scene");
      const video = document.getElementById("video");

      const playButton = document.getElementById("playButton");
      const pauseButton = document.getElementById("pauseButton");

      const touchSound = new Audio("photo/touch.mp3");

      let wasPlayInside = false;
      let wasPauseInside = false;

      function controlVideo() {
        const hands = scene.components.hands;

        const playInside = hands.isPointOnEntity(8, playButton);
        const pauseInside = hands.isPointOnEntity(8, pauseButton);

        if (playInside && !wasPlayInside) {
          video.play();
          touchSound.currentTime = 0;
          touchSound.play();
        }

        if (pauseInside && !wasPauseInside) {
          video.pause();
          touchSound.currentTime = 0;
          touchSound.play();
        }

        wasPlayInside = playInside;
        wasPauseInside = pauseInside;
      }

      scene.addEventListener("hand-result", controlVideo);
    </script>
  </body>
</html>
