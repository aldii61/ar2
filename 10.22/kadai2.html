<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
      #hud {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 999;
      }

      button {
        font-size: 20px;
        padding: 12px 20px;
        border: none;
        background-color: royalblue;
        color: white;
        border-radius: 10px;
        margin-right: 10px;
        cursor: pointer;
      }

      select {
        font-size: 18px;
        padding: 10px 12px;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <div id="hud">
      <select id="animationSelect">
        <option value="">Memuat animasi</option>
      </select>
      <button id="enlargeButton">拡大</button>
      <button id="shrinkButton">縮小</button>
      <button id="rotateButton">回転</button>
      <button id="reverseButton">逆回転</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam">
      <a-marker preset="hiro" smooth="true">
        <a-entity id="model" position="0 0 0.5">
          <a-gltf-model
            id="Character"
            src="Anne.glb"
            position="0 0 0"
            scale="0.3 0.3 0.3"
            rotation="-90 0 0"
            animation-mixer="clip: CharacterArmature|Character_Walking"
          >
          </a-gltf-model>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const Character = document.getElementById("Character");
      const animationSelect = document.getElementById("animationSelect");

      const model = document.getElementById("model");
      const enlargeButton = document.getElementById("enlargeButton");
      const shrinkButton = document.getElementById("shrinkButton");
      const rotateButton = document.getElementById("rotateButton");
      const reverseButton = document.getElementById("reverseButton");

      let size = 1;

      function enlargeModel() {
        size = size + 0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }

      enlargeButton.addEventListener("click", enlargeModel);

      function shrinkModel() {
        size = size + -0.1;
        model.setAttribute("scale", `${size} ${size} ${size}`);
      }

      shrinkButton.addEventListener("click", shrinkModel);

      let angle = 0;

      function rotateModel() {
        angle += 15;
        model.setAttribute("rotation", `0 0 ${angle}`);
      }

      rotateButton.addEventListener("click", rotateModel);

      function reverveModel() {
        angle -= 15;
        model.setAttribute("rotation", `0 0 ${angle}`);
      }

      reverseButton.addEventListener("click", reverveModel);

      function changeAnimation() {
        const clipName = animationSelect.value;

        if (!clipName) return;

        Character.setAttribute("animation-mixer", {
          clip: clipName,
          loop: "repeat",
        });
      }

      // Periksa animasi yang benar-benar tersedia dalam Anne.glb
      Character.addEventListener("model-loaded", (event) => {
        const animations = event.detail.model.animations;

        console.log(
          "Nama animasi Anne:",
          animations.map((animation) => animation.name),
        );

        animationSelect.innerHTML = "";

        if (animations.length === 0) {
          animationSelect.add(new Option("Tiada animasi", ""));
          console.warn("Fail Anne.glb tidak mengandungi klip animasi.");
          return;
        }

        animations.forEach((animation) => {
          animationSelect.add(new Option(animation.name, animation.name));
        });

        // Mainkan animasi pertama secara automatik
        animationSelect.value = animations[0].name;
        changeAnimation();
      });

      animationSelect.addEventListener("change", changeAnimation);

      const walkButton = document.getElementById("walkButton");
      const danceButton = document.getElementById("danceButton");
      const punchButton = document.getElementById("punchButton");

      function walkAnimation() {
        Character.setAttribute(
          "animation-mixer",
          "clip",
          "CharacterArmature|Character_Walking",
        );
      }

      function danceAnimation() {
        Character.setAttribute(
          "animation-mixer",
          "clip",
          "CharacterArmature|Character_Dance",
        );
      }

      function punchAnimation() {
        Character.setAttribute(
          "animation-mixer",
          "clip",
          "CharacterArmature|Character_Punch",
        );
      }
    </script>
  </body>
</html>
