    <!-- Sprite animation component for the FIRE effect -->
    <script>
      AFRAME.registerComponent("sprite-animation", {
        schema: {
          src: { type: "string" },
          columns: { type: "int", default: 8 },
          rows: { type: "int", default: 8 },
          frames: { type: "int", default: 64 },
          fps: { type: "int", default: 30 },
          loop: { type: "boolean", default: true },
          autoplay: { type: "boolean", default: true },
          tint: { type: "string", default: "" },
        },

        init: function () {
          const data = this.data;

          this.canvas = document.createElement("canvas");
          this.canvas.width = 256;
          this.canvas.height = 256;
          this.ctx = this.canvas.getContext("2d");

          this.frame = -1;
          this.startTime = null;
          this.playing = data.autoplay;
          this.mesh = null;

          this.image = new Image();

          this.image.onload = () => {
            this.texture = new THREE.CanvasTexture(this.canvas);
            this.texture.colorSpace = THREE.SRGBColorSpace;

            const material = new THREE.MeshBasicMaterial({
              map: this.texture,
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false,
            });

            const geometry = new THREE.PlaneGeometry(1, 1);
            this.mesh = new THREE.Mesh(geometry, material);
            this.mesh.visible = this.playing;

            this.el.setObject3D("mesh", this.mesh);
            this.drawFrame(0);
          };

          this.image.onerror = () => {
            console.error("Sprite failed to load:", data.src);
          };

          this.image.src = data.src;

          this.onPlaySprite = () => {
            this.playing = true;
            this.startTime = null;
            this.frame = -1;

            if (this.mesh) {
              this.mesh.visible = true;
            }

            this.drawFrame(0);
          };

          this.el.addEventListener("play-sprite", this.onPlaySprite);
        },

        drawFrame: function (frame) {
          if (!this.image.complete || !this.texture) return;

          const col = frame % this.data.columns;
          const row = Math.floor(frame / this.data.columns);

          const frameWidth = this.image.width / this.data.columns;
          const frameHeight = this.image.height / this.data.rows;

          this.ctx.clearRect(0, 0, 256, 256);
          this.ctx.drawImage(
            this.image,
            col * frameWidth,
            row * frameHeight,
            frameWidth,
            frameHeight,
            0,
            0,
            256,
            256,
          );

          // Optional color overlay while preserving the sprite's transparency.
          if (this.data.tint) {
            this.ctx.globalCompositeOperation = "source-atop";
            this.ctx.fillStyle = this.data.tint;
            this.ctx.fillRect(0, 0, 256, 256);
            this.ctx.globalCompositeOperation = "source-over";
          }

          this.texture.needsUpdate = true;
          this.frame = frame;
        },

        tick: function (time) {
          if (!this.texture || !this.playing) return;

          if (this.startTime === null) {
            this.startTime = time;
          }

          const elapsed = time - this.startTime;
          let frame = Math.floor((elapsed * this.data.fps) / 1000);

          if (this.data.loop) {
            frame = frame % this.data.frames;
          } else if (frame >= this.data.frames) {
            this.drawFrame(this.data.frames - 1);
            this.playing = false;

            if (this.mesh) {
              this.mesh.visible = false;
            }

            this.el.emit("animation-finished");
            return;
          }

          if (frame !== this.frame) {
            this.drawFrame(frame);
          }
        },

        remove: function () {
          this.el.removeEventListener("play-sprite", this.onPlaySprite);
          this.el.removeObject3D("mesh");

          if (this.texture) {
            this.texture.dispose();
          }
        },
      });
    </script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: transparent;
        color: white;
      }

      #hud {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        width: min(95%, 540px);
        padding: 16px;
        background: rgba(15, 20, 35, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 18px;
        text-align: center;
        pointer-events: auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 23px;
        color: #ffffff;
      }

      .element-buttons {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 9px;
      }

      .element-btn {
        min-width: 105px;
        padding: 11px 15px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        color: white;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition:
          transform 0.2s,
          outline 0.2s,
          filter 0.2s;
      }

      .element-btn:active {
        transform: scale(0.94);
      }

      .element-btn.active {
        outline: 2px solid white;
        outline-offset: 2px;
        transform: scale(1.05);
        filter: brightness(1.2);
      }

      .fire-btn {
        background: linear-gradient(135deg, #ff7a18, #c62800);
      }

      .ice-btn {
        background: linear-gradient(135deg, #28c9ed, #0873b9);
      }

      .thunder-btn {
        background: linear-gradient(135deg, #a36bff, #5030a8);
      }

      #currentElement {
        margin-top: 13px;
        font-size: 14px;
        font-weight: bold;
        color: white;
      }

      #castElementBtn {
        margin-top: 13px;
        padding: 11px 26px;
        border: 1px solid #ffb15c;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff7a18, #d62800);
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(255, 85, 0, 0.35);
      }

      #castElementBtn:active {
        transform: scale(0.94);
      }

      .a-enter-vr {
        display: none;
      }

      @media (max-width: 480px) {
        #hud {
          top: 8px;
          padding: 12px;
        }

        h1 {
          font-size: 19px;
        }

        .element-btn {
          min-width: 88px;
          padding: 10px 11px;
          font-size: 12px;
        }
      }

      #castElementBtn {
        margin-top: 13px;
        padding: 11px 26px;
        border: 1px solid #ffb15c;
        border-radius: 12px;
        background: linear-gradient(135deg, #ff7a18, #d62800);
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(255, 85, 0, 0.35);
        transition: all 0.3s ease;
      }

      /* FIRE */
      #castElementBtn.fire-active {
        border-color: #ffb15c;
        background: linear-gradient(135deg, #ff7a18, #d62800);
        box-shadow: 0 0 18px rgba(255, 85, 0, 0.45);
      }

      /* ICE */
      #castElementBtn.ice-active {
        border-color: #8beaff;
        background: linear-gradient(135deg, #28c9ed, #0873b9);
        box-shadow: 0 0 18px rgba(40, 201, 237, 0.45);
      }

      /* THUNDER */
      #castElementBtn.thunder-active {
        border-color: #c5a3ff;
        background: linear-gradient(135deg, #a36bff, #5030a8);
        box-shadow: 0 0 18px rgba(163, 107, 255, 0.45);
      }

      #castElementBtn:active {
        transform: scale(0.94);
      }
    </style>

      <h1>三つの元素の力</h1>

      <div class="element-buttons">
        <button class="element-btn fire-btn active" data-element="fire">
          🔥 炎
        </button>
        <button class="element-btn ice-btn" data-element="ice">❄️ 氷</button>
        <button class="element-btn thunder-btn" data-element="thunder">

                  easing: easeInOutSine;

                radius="0.29"

              <!-- Fire particle 3 -->

              <!-- Fire particle 4 -->
              <a-entity

          <!-- ==================== ICE ==================== -->

            <!-- Bright inner crystal -->

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // ELEMENT REFERENCES
        const elements = {
          fire: document.getElementById("fireElement"),
          ice: document.getElementById("iceElement"),
          thunder: document.getElementById("thunderElement"),
        };

        const explosions = {
          fire: document.getElementById("fireExplosion"),
          ice: document.getElementById("iceExplosion"),
          thunder: document.getElementById("thunderExplosion"),
        };

        const names = {
          fire: "🔥 炎",
          ice: "❄️ 氷",
          thunder: "⚡ 雷",
        };

        const castLabels = {
          fire: "🔥 炎を放つ",
          ice: "❄️ 氷を放つ",
          thunder: "⚡ 雷を放つ",
        };

        const buttons = document.querySelectorAll(".element-btn");
        const currentElement = document.getElementById("currentElement");
        const castElementBtn = document.getElementById("castElementBtn");

        let selectedElement = "fire";

        // UPDATE CAST BUTTON COLOR
        function updateCastButton(element) {
          castElementBtn.classList.remove(
            "fire-active",
            "ice-active",
            "thunder-active",
          );

          castElementBtn.classList.add(`${element}-active`);
        }

        // SELECT ELEMENT
        function selectElement(selected) {
          if (!elements[selected]) return;

          selectedElement = selected;

          // Show selected element effect
          Object.keys(elements).forEach((key) => {
            elements[key].setAttribute("visible", key === selected);
          });

          // Update element selection buttons
          buttons.forEach((button) => {
            button.classList.toggle(
              "active",
              button.dataset.element === selected,
            );
          });

          // Update current element text
          currentElement.textContent = "現在の属性： " + names[selected];

          // Update CAST button text
          castElementBtn.textContent = castLabels[selected];

          // Update CAST button color
          updateCastButton(selected);
        }

        // ELEMENT BUTTON EVENTS
        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const selected = button.dataset.element;
            selectElement(selected);
          });
        });

        // CAST EXPLOSION
        castElementBtn.addEventListener("click", () => {
          const explosion = explosions[selectedElement];

          if (!explosion) {
            console.error("Explosion not found:", selectedElement);
            return;
          }

          // Restart the selected explosion
          explosion.emit("play-sprite");
        });

        // INITIAL ELEMENT
        selectElement("fire");
      });
    </script>
  </body>
</html>
